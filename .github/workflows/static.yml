name: Deploy Field Guide to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "system-design-next-gen/**"
      - "notes/**"
      - "readme.md"
      - "must-know-topics.md"
      - "interview-playbook.md"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: system-design-next-gen/package-lock.json

      - name: Install dependencies
        working-directory: system-design-next-gen
        run: npm ci

      - name: Build dashboard
        working-directory: system-design-next-gen
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: system-design-next-gen/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
